[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoiceops-ml"
version = "0.1.0"
description = "InvoiceOps research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow==3.16.0",
    "scikit-learn==1.9.1",
]

[project.scripts]
invoiceops-quality-gate = "invoiceops_ml.gate:main"

[dependency-groups]
dev = [
    "ipykernel",
    "nbclient",
    "nbformat",
    "pytest",
    "ruff",
]
teaching = [
    "ipykernel",
    "jupyter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceops_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
